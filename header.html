<style>
  /* පරණ හෙඩර් එක අයින් කරනවා */
  div[class*="Header"], header[class*="header"], .fw-header, #shopify-section-header, .site-header {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
</style>

<div id="adl-injected-header"></div>

<script>
  (function () {
    // jsDelivr ලින්ක් එක කෙලින්ම පාවිච්චි කරනවා
    const finalFetchUrl = 'https://cdn.jsdelivr.net/gh/ameliaclarke634-design/adlest-assets@main/header.html';

    /**
     * 🛠️ PART 1 — Chatbot's Script Re-Executor
     * HTML එක Inject වුණාට පස්සේ ඒ ඇතුලේ තියෙන ස්ක්‍රිප්ට් බලෙන්ම රන් කරවන කොටස
     */
    function reExecuteInjectedScripts(container) {
      const scripts = Array.from(container.querySelectorAll('script'));

      scripts.forEach(function (oldScript) {
        const newScript = document.createElement('script');

        // Copy all attributes (type, src, defer, async, data-*, etc.)
        Array.from(oldScript.attributes).forEach(function (attr) {
          newScript.setAttribute(attr.name, attr.value);
        });

        // Copy inline script body
        if (oldScript.textContent) {
          newScript.textContent = oldScript.textContent;
        }

        // Replace in-place so relative DOM position is preserved
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    // HTML එක Fetch කරලා Inject කිරීම
    fetch(finalFetchUrl)
      .then(r => {
        if (!r.ok) throw new Error("Header load failed");
        return r.text();
      })
      .then(htmlData => {
        const container = document.getElementById('adl-injected-header');
        container.innerHTML = htmlData;

        // 🚀 බොට් කියපු ප්‍රධානතම පියවර — ඉන්ජෙක්ට් කරපු ගමන් ස්ක්‍රිප්ට් ටික රී-එක්සිකියුට් කරනවා
        reExecuteInjectedScripts(container);
      })
      .catch(err => {
        console.error("Error loading header:", err);
        // මොකක් හරි වෙලා හෙඩර් එක ලෝඩ් වුනේ නැත්නම් පරණ එක ආයේ පෙන්වනවා
        const fallbackStyle = document.createElement('style');
        fallbackStyle.textContent = 'div[class*="Header"], header[class*="header"], .fw-header, #shopify-section-header, .site-header { display: block !important; visibility: visible !important; height: auto !important; opacity: 1 !important; pointer-events: auto !important; }';
        document.head.appendChild(fallbackStyle);
      });
  })();
</script>
